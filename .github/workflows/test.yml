name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install build tools needed for Poetry projects
        pip install build wheel setuptools
        # Install the project with all extras
        pip install -e ".[all]"
        # Install additional test dependencies
        pip install python-dotenv pytest pytest-asyncio pytest-cov

    - name: Run unit tests
      run: |
        # Coverage is reported (source fixed from the stale `miiflow_llm`
        # package name, which measured nothing) but not yet gated — add a
        # --cov-fail-under floor once a baseline is agreed.
        python -m pytest tests/ -v --tb=short --cov=miiflow_agent --cov-report=term


  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
        
    # Advisory only: the codebase predates black/isort enforcement, so a
    # blocking check would require a whole-package reformat. continue-on-error
    # keeps the signal visible on the step without failing the build — unlike
    # the previous `|| echo`, which silently swallowed the exit code and made
    # the checks look enforced when they never were.
    - name: Check code formatting with Black (advisory)
      continue-on-error: true
      run: |
        black --check --diff miiflow_agent/ tests/

    - name: Check import sorting with isort (advisory)
      continue-on-error: true
      run: |
        isort --check-only --diff miiflow_agent/ tests/

    # BLOCKING: these flake8 selections are real-bug classes (syntax errors,
    # undefined names, misused comparisons) — a failure here is a broken
    # module, not a style opinion.
    - name: Lint with flake8 (blocking)
      run: |
        flake8 miiflow_agent/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
