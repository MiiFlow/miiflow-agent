[tool.poetry]
name = "miiflow-agent"
version = "1.22.1"
description = "A model-agnostic agent harness for Python: agent loop, tools, sub-agents, human-in-the-loop, MCP and context management on any LLM provider"
authors = [ "Yaozhong Kang <yaozhong@miiflow.ai>" , "Debjyoti Ray <dev@miiflow.ai>" ]
maintainers = [ "Yaozhong Kang <yaozhong@miiflow.ai>" ]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/Miiflow/miiflow-agent"
repository = "https://github.com/Miiflow/miiflow-agent"
documentation = "https://github.com/Miiflow/miiflow-agent#readme"
keywords = ["agent", "agent-harness", "agent-sdk", "llm", "openai", "anthropic", "gemini", "orchestration", "tools", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
# Floor raised 3.9 -> 3.10 for openai 2.x, which requires >=3.10. The server
# runs 3.11, so nothing here regressed; this only narrows who else could
# install the package.
python = ">=3.10,<3.13"
# 2.x: the only documented breaking change in v2.0.0 is
# ResponseFunctionToolCallOutputItem.output / ResponseCustomToolCallOutput.output
# widening from `str` to `str | list[...]`. This package never reads those
# types — the streaming path reads `response.output_text.delta` — so the
# migration is a version bump, not a code change.
openai = "^2.52.0"
# >=0.84 is required by openinference-instrumentation-anthropic 1.x; below
# that the instrumentor silently declines to attach (DependencyConflict) and
# NO LLM spans are captured. Kept as a caret on 0.x semantics deliberately —
# a pre-1.0 SDK, so widen only with a test run.
anthropic = ">=0.120.2,<0.126.0"
pydantic = "^2.0.0"
tiktoken = "^0.14.0"
tenacity = "^9.0.0"
aiohttp = "^3.13.3"
httpx = "^0.28.0"
structlog = "^26.1.0"
typing-extensions = "^4.8.0"

# Optional dependencies for specific providers
groq = { version = "^1.7.0", optional = true }
google-genai = { version = "^2.8.0", optional = true }
mistralai = { version = "^1.0.0", optional = true }

# Optional multimedia dependencies
PyMuPDF = { version = "^1.23.0", optional = true }
# Range spans 10-12: the package uses only long-stable Image APIs (open, size,
# thumbnail/resize, save), and 12.3.0 is the first release without the
# 2026 decoder/heap advisories, so the lock resolves there.
Pillow = { version = ">=10.0.0,<13.0.0", optional = true }

# Optional example dependencies
yfinance = { version = "^1.7.0", optional = true }

# Optional MCP (Model Context Protocol) support
mcp = { version = "^1.23.0", optional = true, python = ">=3.10" }

# Optional AG-UI (Agent-User Interaction Protocol) support
ag-ui-protocol = { version = "^1.0.0", optional = true }

# Optional observability dependencies
opentelemetry-api = { version = "^1.27.0", optional = true }
opentelemetry-sdk = { version = "^1.27.0", optional = true }
opentelemetry-exporter-otlp = { version = "^1.27.0", optional = true }
prometheus-client = { version = "^0.26.0", optional = true }
# arize-phoenix (the Phoenix *server*) is deliberately not an extra. The only
# code that touches it is launch_local_phoenix(), a dev convenience that
# imports it lazily and degrades to a warning. Tracing itself exports over
# OTLP and never imports phoenix. Bundling the server pinned users to its
# whole stack (exact strawberry-graphql, pyarrow, protobuf<6, numpy<2,
# scikit-learn/umap), and every Phoenix release with a patched
# strawberry-graphql also requires anthropic>=1, which conflicts with the
# anthropic pin above. Install it yourself to launch a local UI, or run
# Phoenix as a service (`docker run arizephoenix/phoenix`).

# OpenInference auto-instrumentation
openinference-instrumentation-openai = { version = "^0.1.12", optional = true }
openinference-instrumentation-anthropic = { version = "^0.1.5", optional = true }
openinference-instrumentation-google-genai = { version = "^1.4.13", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
# 1.3 is the first pytest-asyncio that accepts pytest 9 (1.0-1.2 cap <9).
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
black = "^26.3.1"
isort = "^9.0.2"
flake8 = "^7.0.0"
mypy = "^2.4.0"
python-dotenv = "^1.2.1"

[tool.poetry.extras]
groq = ["groq"]
google = ["google-genai"]
mistral = ["mistralai"]
pdf = ["PyMuPDF"]
multimedia = ["PyMuPDF", "Pillow"]
images = ["Pillow"]
examples = ["yfinance"]
mcp = ["mcp"]
agui = ["ag-ui-protocol"]
observability = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp", "prometheus-client", "openinference-instrumentation-openai", "openinference-instrumentation-anthropic", "openinference-instrumentation-google-genai"]
all = ["groq", "google-genai", "mistralai", "PyMuPDF", "Pillow", "yfinance", "mcp", "ag-ui-protocol", "opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp", "prometheus-client", "openinference-instrumentation-openai", "openinference-instrumentation-anthropic", "openinference-instrumentation-google-genai"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

# NOTE: aspirational — mypy is not wired into CI and the codebase does not
# pass strict mode today. Kept for local/incremental use; wiring it into CI
# requires paying down the typing debt module by module first.
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers"
]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async"
]
